<script type="text/babel">
// ── Router SPA por hash ──────────────────────────────────────────────────────
// Rotas:
//   #/            → Homepage
//   #/sobre       → Sobre
//   #/contactos   → Contactos
//   #/servicos/fisioterapia  → CategoryPage
//   #/servicos/massagens     → CategoryPage
//   #/servicos/holisticas    → CategoryPage
//   #/servicos/<slug>        → ServicePage
//   (qualquer outra coisa)   → Homepage

// Patchamos todos os hrefs para usarem hash routing
function patchHref(href) {
  if (!href || href.startsWith('http') || href.startsWith('tel:') || href.startsWith('mailto:') || href.startsWith('#') || href.startsWith('https:')) return href;
  // ficheiros html → hash routes
  const map = {
    'index.html': '#/',
    'sobre.html': '#/sobre',
    'contactos.html': '#/contactos',
    'fisioterapia.html': '#/servicos/fisioterapia',
    'massagens.html': '#/servicos/massagens',
    'holisticas.html': '#/servicos/holisticas',
  };
  if (map[href]) return map[href];
  // servico-<slug>.html
  const m = href.match(/^servico-(.+)\.html$/);
  if (m) return `#/servico/${m[1]}`;
  return href;
}

// Componente Link — converte hrefs automaticamente
function Link({ href, children, style, className, target, rel, onMouseEnter, onMouseLeave, onClick }) {
  const converted = patchHref(href);
  const handleClick = (e) => {
    if (onClick) onClick(e);
    if (converted && converted.startsWith('#/')) {
      e.preventDefault();
      window.location.hash = converted.slice(1); // sem o #
      window.scrollTo(0,0);
    }
  };
  return (
    <a href={converted} style={style} className={className} target={target} rel={rel}
      onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} onClick={handleClick}>
      {children}
    </a>
  );
}

// Hook de routing
function useRoute() {
  const getRoute = () => {
    const hash = window.location.hash || '#/';
    return hash.startsWith('#') ? hash.slice(1) || '/' : '/';
  };
  const [route, setRoute] = React.useState(getRoute);
  React.useEffect(() => {
    const handler = () => { setRoute(getRoute()); window.scrollTo(0,0); };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  return route;
}

// Páginas inline (usando componentes dos JSX externos mas com hrefs patched)
function HomePage() {
  // Patch: substituir hrefs internos nos componentes via override de navegação
  // Os componentes Home usam <a href="X.html"> — remapear cliques
  React.useEffect(() => {
    const handler = (e) => {
      const a = e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      const converted = patchHref(href);
      if (converted && converted !== href && converted.startsWith('#/')) {
        e.preventDefault();
        window.location.hash = converted.slice(1);
        window.scrollTo(0,0);
      }
    };
    document.getElementById('root').addEventListener('click', handler);
    return () => document.getElementById('root').removeEventListener('click', handler);
  }, []);

  return (<>
    <NavSPA current="home" />
    <Hero />
    <StatsStrip />
    <ServicesCard />
    <WhyUs />
    <ServicesOverview />
    <Testimonials />
    <HomeCTA />
    <Footer />
    <WAFab />
  </>);
}

// Router principal
function App() {
  const route = useRoute();

  // patch global de cliques para links que os componentes externos (Hero, ServicesCard, etc.) geram
  React.useEffect(() => {
    const handler = (e) => {
      const a = e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href) return;
      const converted = patchHref(href);
      if (converted && converted !== href && converted.startsWith('#/')) {
        e.preventDefault();
        window.location.hash = converted.slice(1);
        window.scrollTo(0,0);
      }
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);

  if (route === '/' || route === '') return <HomePage />;
  if (route === '/sobre') return <SobrePage />;
  if (route === '/contactos') return <ContactosPageWrapper />;
  if (route === '/servicos/fisioterapia') return <CategoryPageWrapper categoryId="fisioterapia" />;
  if (route === '/servicos/massagens') return <CategoryPageWrapper categoryId="massagens" />;
  if (route === '/servicos/holisticas') return <CategoryPageWrapper categoryId="holisticas" />;
  const serviceMatch = route.match(/^\/servico\/(.+)$/);
  if (serviceMatch) return <ServicePageWrapper slug={serviceMatch[1]} />;
  return <HomePage />;
}

const ready = () => {
  const needed = ['RG','F_BODY','F_DISPLAY','F_MONO','TRANSLATIONS','LangContext','LangProvider','useLang',
    'Container','Reveal','Eyebrow','Heading','Body','Button','Photo','Section','Footer','WAFab',
    'SERVICES','SERVICE_DETAIL','IMG','findService',
    'Hero','StatsStrip','ServicesCard','WhyUs','ServicesOverview','Testimonials','HomeCTA',
    'SobreHero','Mission','Pillars','Story','Team'];
  if (needed.every(k => window[k])) {
    ReactDOM.createRoot(document.getElementById('root')).render(<LangProvider><App /></LangProvider>);
  } else {
    setTimeout(ready, 40);
  }
};
ready();
